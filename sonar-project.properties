# Análise do SonarQube local (projeto ../sonarqube). Uso: npm run test:coverage && ../sonarqube/scripts/scan.sh .
sonar.projectKey=site-principal
sonar.projectName=Site Principal
# Só o código do site: mídias, favicons e arquivos de SEO ficam de fora.
sonar.sources=index.html,css,js,server.js
sonar.tests=tests
sonar.sourceEncoding=UTF-8
# Cobertura do Vitest (npm run test:coverage).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
